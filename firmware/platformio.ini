; Phase 2 firmware — Waveshare ESP32-S3-ETH
;
; The MCU is ESP32-S3R8 with 16 MB QSPI flash and 8 MB octal PSRAM.
; W5500 is wired to SPI on the GPIOs below — confirmed against the
; Waveshare schematic, not assumed.
;
; lib_extra_dirs pulls in ../lib/prolink/ so the same pure-C++17 core
; that drives the desktop bridge compiles into firmware unchanged.

[platformio]
default_envs = waveshare_esp32s3_eth

[env:waveshare_esp32s3_eth]
platform = espressif32
board = esp32-s3-devkitc-1
; Mixed framework: ESP-IDF for esp_eth (W5500 over SPI) + lwIP BSD sockets,
; Arduino-on-top for uClock and HardwareSerial DIN MIDI output.
framework = arduino, espidf

monitor_speed = 115200
upload_speed = 921600

; ESP32-S3R8 module spec. The IDF-side flash/partition config lives in
; sdkconfig.defaults — in mixed-framework mode those don't propagate
; from these PIO board_build keys, so they have to be set on both
; sides to stay consistent.
board_build.flash_size = 16MB
board_upload.flash_size = 16MB

; Pull lib/prolink/ in from the workspace root.
lib_extra_dirs = ../lib

build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    ; W5500 SPI pinout (Waveshare ESP32-S3-ETH, per schematic 2024-12-21)
    -DETH_W5500_SCK=13
    -DETH_W5500_MISO=12
    -DETH_W5500_MOSI=11
    -DETH_W5500_CS=14
    -DETH_W5500_INT=10
    -DETH_W5500_RST=9
    ; Onboard WS2812B status LED. Schematic (2026-06-01): DIN routes via
    ; alternate 0R jumpers R13 (default → GP4) / R15 (alt → GP21). Drive
    ; both since boards ship stuffed either way.
    -DBOARD_RGB_LED_PIN=4
    -DBOARD_RGB_LED_PIN_ALT=21
    ; DIN MIDI UART TX (per docs/handoff.md, free at header H1 with no camera)
    -DMIDI_DIN_TX_PIN=17
    ; Front-panel UI (v4 pin map). OLED on I2C (H1), EC11 encoder (H1),
    ; nudge/tap buttons (H2). All verified free, non-strapping.
    -DOLED_SCL_PIN=16
    -DOLED_SDA_PIN=15
    -DENC_A_PIN=18
    -DENC_B_PIN=2
    -DENC_SW_PIN=1
    -DBTN_NUDGE_L_PIN=38
    -DBTN_NUDGE_R_PIN=39
    -DBTN_TAP_PIN=40

build_unflags =
    -std=gnu++11

; Network stack: ESP-IDF native esp_eth (W5500 SPI driver) + lwIP — no
; external library needed; pulled in by framework = espidf.
; DIN MIDI: HardwareSerial(1) at 31250 baud — no library.
;
; Deferred until we wire them in (each has version-compatibility work):
;   - midilab/uClock (Phase 2 tick generator). 2.2.x requires
;     arduino-esp32 v3 timer APIs; this platform ships v2.0.x. Will need
;     either uClock pinned to ^2.1 or a platform upgrade to pioarduino.
;   - sauloverissimo/ESP32_Host_MIDI (Phase 3 USB MIDI host).
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    olikraus/U8g2 @ ^2.35.19

; Diagnostic env: identical to production but compiles the counter-only
; MIDI stub instead of the USB host and skips usb_host_install(), so the
; USB-Serial-JTAG console over USB-C stays alive. Use this to verify the
; network → master → clock half of the pipeline on serial:
;   pio run -e diag -t upload && pio device monitor -e diag
[env:diag]
extends = env:waveshare_esp32s3_eth
build_flags =
    ${env:waveshare_esp32s3_eth.build_flags}
    -DDIAG_SERIAL_STUB
