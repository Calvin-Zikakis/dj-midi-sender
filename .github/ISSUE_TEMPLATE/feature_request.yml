name: Feature request
description: Suggest an idea or enhancement for the bridge
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Check the [roadmap](../blob/main/ROADMAP.md) and
        existing issues first in case it is already tracked.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The use case or pain point. What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to see happen.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project does this touch?
      multiple: true
      options:
        - Core (lib/prolink)
        - Firmware (ESP32-S3)
        - Desktop bridge
        - Hardware / wiring
        - Pro DJ Link protocol
        - Documentation
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, if any.
    validations:
      required: false
