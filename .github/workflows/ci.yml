name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The portable core plus its unit tests. No external dependencies, so this is
  # the fast gate that runs everywhere.
  core-tests:
    name: Core tests (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, compiler: gcc,   cc: gcc,   cxx: g++ }
          - { os: ubuntu-latest, compiler: clang, cc: clang, cxx: clang++ }
          - { os: macos-latest,  compiler: clang, cc: clang, cxx: clang++ }
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DXDJ_DESKTOP=OFF \
            -DXDJ_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  # Same tests under the sanitizers. The core is threaded (the bridge poll loop
  # runs alongside the UI/clock), so data races are a real risk worth catching.
  sanitizers:
    name: Sanitizers (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread, undefined]
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DXDJ_DESKTOP=OFF \
            -DXDJ_TESTS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizer }}"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        env:
          # The tests are timing-sensitive; sanitizers slow them down.
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --output-on-failure --timeout 300

  # The desktop binaries need RtMidi + libpcap; build them to keep the shared
  # core honest (a change in lib/prolink must not break the desktop target).
  desktop-build:
    name: Desktop build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librtmidi-dev libpcap-dev libglfw3-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DXDJ_DESKTOP=ON \
            -DXDJ_GUI=OFF

      - name: Build
        run: cmake --build build --parallel

  # The firmware shares lib/prolink verbatim, so it has to keep compiling too.
  firmware-build:
    name: Firmware build (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [waveshare_esp32s3_eth, diag]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini', 'firmware/sdkconfig.defaults') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build
        working-directory: firmware
        run: pio run -e ${{ matrix.env }}
